<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSC-102 :: Auth Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --g: #39ff14;
  --gdim: #1a8c00;
  --gglow: rgba(57,255,20,0.18);
  --bg: #050905;
  --cyan: #00e5ff;
  --mono: 'Share Tech Mono', monospace;
  --vt: 'VT323', monospace;
}
html,body { height:100%; background:var(--bg); color:var(--g); font-family:var(--mono); overflow:hidden; }
body::before {
  content:''; position:fixed; inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.18) 2px,rgba(0,0,0,0.18) 4px);
  pointer-events:none; z-index:999;
}
.scanline { position:fixed; top:0; left:0; right:0; height:4px; background:linear-gradient(transparent,rgba(57,255,20,0.06),transparent); animation:scan 7s linear infinite; pointer-events:none; z-index:997; }
@keyframes scan { 0%{transform:translateY(-100%)} 100%{transform:translateY(100vh)} }

.container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
.box { border: 1px solid var(--gdim); padding: 2rem; background: rgba(57,255,20,0.03); box-shadow: 0 0 20px rgba(57,255,20,0.1); width: 400px; max-width: 90%; text-align: center; position: relative; }
.blabel { position:absolute; top:-.52rem; left:1rem; background:var(--bg); padding:0 .45rem; font-size:.7rem; color:var(--gdim); letter-spacing:.12em; text-transform:uppercase; }
.title { font-family:var(--vt); font-size: 3rem; color:var(--cyan); margin-bottom: 0.5rem; text-shadow: 0 0 10px var(--cyan); }
.subtitle { font-size: 0.8rem; color: var(--gdim); margin-bottom: 2rem; }
input { width: 100%; background: #000; border: 1px solid var(--gdim); color: var(--g); padding: 12px; font-family: var(--mono); font-size: 1rem; margin-bottom: 1rem; outline: none; text-align: center; }
input:focus { border-color: var(--g); box-shadow: 0 0 10px var(--gglow); }
button { width: 100%; background: transparent; border: 1px solid var(--g); color: var(--g); font-family: var(--vt); font-size: 1.5rem; letter-spacing: .1em; padding: 10px; cursor: pointer; transition: 0.2s; }
button:hover { background: var(--gglow); box-shadow: 0 0 15px var(--gglow); }
.error { color: #ff3c3c; font-size: 0.8rem; margin-top: 1rem; display: none; }

@media (max-width: 480px) {
  .box { padding: 1.5rem; max-width: 95%; width: 100%; }
  .title { font-size: 2.2rem; }
  .subtitle { font-size: 0.75rem; margin-bottom: 1.5rem; }
  input { font-size: 1.1rem; padding: 10px; }
  button { font-size: 1.3rem; }
}
</style>
</head>
<body>
<div class="scanline"></div>
<div class="container">
  <div class="box">
    <div class="blabel">SYSTEM_AUTH</div>
    <div class="title">QUIZ_TERMINAL</div>
    <div class="subtitle">ENTER ROLL NUMBER TO CONTINUE</div>
    <input type="text" id="rollno" placeholder="e.g. 26SP-007-SE" onkeydown="if(event.key==='Enter') login()">
    <button onclick="login()">[ AUTHENTICATE ]</button>
    <div class="error" id="err-msg">INVALID ROLL NUMBER</div>
  </div>
</div>

<script>
async function login() {
  const rollno = document.getElementById('rollno').value.trim();
  if(!rollno) return;
  
  try {
    const res = await fetch('/api/student/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ roll_no: rollno })
    });
    const data = await res.json();
    if(data.success) {
      sessionStorage.setItem('student', JSON.stringify(data.student));
      sessionStorage.setItem('session_id', data.session_id);
      window.location.href = 'dashboard.html';
    } else {
      document.getElementById('err-msg').style.display = 'block';
    }
  } catch(e) {
    document.getElementById('err-msg').textContent = "SERVER ERROR";
    document.getElementById('err-msg').style.display = 'block';
  }
}
</script>
</body>
</html>
